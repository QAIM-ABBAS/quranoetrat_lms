[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-oetrat-backend"
version = "0.1.0"
description = "Backend API for the Quran Oetrat education platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",                # Migrations
    "asyncpg>=0.29.0",                # PostgreSQL async driver
    "fastapi[standard]>=0.111.0",     # Includes uvicorn, multipart, email-validator, etc.
    "passlib[bcrypt]>=1.7.4",         # Password hashing (brings bcrypt with it)
    "pydantic-settings>=2.3.4",       # Settings management
    "python-jose[cryptography]>=3.3.0", # JWT handling
    "sqlalchemy[asyncio]>=2.0.31",    # Async ORM
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "httpx>=0.27.0",
    "mypy>=1.10.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true