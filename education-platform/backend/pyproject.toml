[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-oetrat-backend"
version = "0.1.0"
description = "Backend API for the Quran Oetrat education platform."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.3",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.3.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.31",
    "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "httpx>=0.27.0",
    "mypy>=1.10.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0"
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true